name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: watcher tests
        run: node tests/watcher.test.mjs
